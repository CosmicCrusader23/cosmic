<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="author" content="Cosmic Crusader">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✿</text></svg>">
  <script>
    (function () {
      var savedTheme = localStorage.getItem('theme');
      document.documentElement.classList.add(savedTheme === 'light' ? 'light' : 'dark');
    }());
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ASSET_PREFIX}}style.css?v=anchor-fix-3">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <nav class="nav-bar" aria-label="Main navigation">
    <div class="nav-container">
      <a href="{{ASSET_PREFIX}}" class="nav-link">home</a>
      <a href="{{ASSET_PREFIX}}posts.html" class="nav-link active">posts</a>
    </div>
  </nav>
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="true">
    <i data-lucide="sun" class="icon-sun" aria-hidden="true"></i>
    <i data-lucide="moon" class="icon-moon" aria-hidden="true"></i>
  </button>
  <main id="main" class="post-page-main">
    <div class="post-shell">
      {{TOC}}
      <article class="post-article">
        <header class="post-header">
          <a class="back-link" href="{{ASSET_PREFIX}}posts.html">← all posts</a>
          <h1>{{POST_TITLE}}</h1>
          <p class="post-meta">{{POST_META}}</p>
        </header>
        <div class="markdown-body">{{BODY}}</div>
      </article>
    </div>
  </main>
  <footer><p><span class="footer-year">2026</span><span class="footer-sep" aria-hidden="true">·</span><span class="footer-line">{{FOOTER}}</span></p></footer>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();</script>
  <script src="{{ASSET_PREFIX}}theme.js?v=anchor-fix-3"></script>
  <script src="{{ASSET_PREFIX}}post.js"></script>
</body>
</html>
